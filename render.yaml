# =============================================================================
# VideoSense AI - Render Infrastructure as Code (Blueprint)
# =============================================================================
# Automatically provisions:
#   1. Managed PostgreSQL Database (videosense-db)
#   2. FastAPI Backend Container Service (videosense-backend)
#   3. React Vite Frontend Static Site (videosense-frontend)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: videosense-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: videosense-db
          property: connectionString
      - key: APP_SECRET_KEY
        generateValue: true
      - key: VIDEOSENSE_JWT_SECRET
        generateValue: true
      - key: VIDEOSENSE_OTP_PEPPER
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DEVICE
        value: cpu
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: PYTHONMALLOC
        value: "malloc"

  # ---------------------------------------------------------------------------
  # 2. React Vite Frontend Static Site (Global CDN - no region)
  # ---------------------------------------------------------------------------
  - type: web
    name: videosense-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: videosense-backend
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# -----------------------------------------------------------------------------
# 3. Render Managed PostgreSQL Database
# -----------------------------------------------------------------------------
databases:
  - name: videosense-db
    databaseName: videosense_ai
    user: videosense_user
    plan: free
    region: oregon

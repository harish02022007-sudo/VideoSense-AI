app:
  env: "demo"
  debug: true
  title: "VideoSense AI Demo"
  port: 8080
  host: "0.0.0.0"

database:
  url: "sqlite:///./videosense_demo.db"
  pool_size: 10
  max_overflow: 15

logging:
  level: "INFO"
  format: "text"
  save_to_file: true
  file_path: "./logs/demo.log"

storage:
  upload_dir: "./uploads_demo"
  output_dir: "./outputs_demo"
  cache_dir: "./cache_demo"
  max_file_size_mb: 200
  allowed_extensions: ["mp4"]

models:
  device: "cpu"
  manager:
    lazy_load: true
    unload_inactive_after_sec: 180
  yolo:
    model_name: "yolo11n.pt"
    confidence_threshold: 0.30
  whisper:
    model_name: "tiny"
    device: "cpu"
  ocr:
    lang: "en"
    use_gpu: false
  clip:
    model_name: "sentence-transformers/clip-ViT-B-32"
  llm:
    provider: "mock"  # Demo uses mock by default for speed and independence
    local_model_path: ""
    api_key: ""
    temperature: 0.7

cache:
  ttl_seconds: 1800
  enabled: true

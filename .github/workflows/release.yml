name: Release Packager

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Create release zip
      run: |
        zip -r videosense-ai-${{ github.ref_name }}.zip . -x "*.git*" "**/node_modules*" "backend/.venv*" "**/__pycache__*"
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          videosense-ai-${{ github.ref_name }}.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

version: "3.8"

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - VIDEOSENSE_ENV=development
      - ENV=development
    volumes:
      - ../backend:/app
      - ../configs:/configs
      - ../uploads:/app/uploads
      - ../logs:/app/logs
      - ../cache:/app/cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
